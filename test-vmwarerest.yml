---
- name: Preflight vCenter privilege check before clone
  hosts: localhost
  gather_facts: false
  vars:
    vm_cluster_id: "domain-c1198154"
    vm_datastore_id: "datastore-1198166"
    vm_resource_pool_id: "resgroup-1201139"
    vm_source_id: "vm-1209383"

  tasks:
    - name: Clone VM only after preflight passes
      vmware.vmware_rest.vcenter_vm:
        placement:
          cluster: "{{ vm_cluster_id }}"
          datastore: "{{ vm_datastore_id }}"
          resource_pool: "{{ vm_resource_pool_id }}"
        source: "{{ vm_source_id }}"
        name: "test_vm3"
        state: clone