---
- name: List Azure virtual machines
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Optional. Set this to limit the query to one resource group.
    azure_resource_group: ""

  tasks:
    - name: Get Azure VM information
      azure.azcollection.azure_rm_virtualmachine_info:
        resource_group: "{{ azure_resource_group | default(omit) }}"
      register: azure_vms

    - name: Show VM names
      ansible.builtin.debug:
        msg: >-
          {{ azure_vms.vms | default([])
             | map(attribute='name')
             | list }}

    - name: Show VM details
      ansible.builtin.debug:
        var: azure_vms.vms
