---
- name: Test tao VM tren vCenter
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Tao may ao test
      community.vmware.vmware_guest:
        # vCenter info được nạp tự động từ AAP Credential hoặc Extra Vars
        validate_certs: false
        datacenter: "{{ datacenter_name }}"
        cluster: "{{ cluster_name }}"
        resource_pool: "{{ resource_pool_name }}"
        name: "{{ vm_name | default('test-vm-default') }}"
        state: poweredon
        guest_id: rhel8_64Guest
        hardware:
          memory_mb: 2048
          num_cpus: 2
          scsi: paravirtual
        disk:
          - size_gb: 20
            type: thin
            datastore: "{{ datastore_name }}"
        networks:
          - name: "{{ network_portgroup }}"
            type: vmxnet3
            start_connected: true