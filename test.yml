---
- name: Test tao VM su dung vmware.vmware.vm
  hosts: localhost
  gather_facts: false
  roles:
    - role: vm
      vars:
        vm_name: "test-vmware-module-01"
        guest_id: "rhel8_64Guest"
        cpu_cores: 2
        cpu_cores_per_socket: 1
        memory_size_mb: 2048
        disk_size: "20gb"
        datacenter_name: "{{ datacenter_name }}"
        cluster_name: "{{ cluster_name }}"
        resource_pool: "{{ resource_pool }}"
        datastore_name: "{{ datastore_name }}"