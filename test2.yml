- name: Install HAProxy on haproxy nodes
  hosts: loadbalancer
  gather_facts: true

  tasks:
    - name: Install HAProxy
      ansible.builtin.yum:
        name: haproxy
        state: present

    - name: Set SELinux to permissive
      ansible.posix.selinux:
        policy: targeted
        state: permissive

    - name: Configure HAProxy from host facts
      ansible.builtin.template:
        src: templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: '0644'
      vars:
        haproxy_frontend_bind: "{{ haproxy_fe_bind | default('*:6443') }}"
        haproxy_backend_name: "{{ haproxy_be_name | default('kubernetes_api_servers') }}"
        haproxy_api_server_port: 6443
        haproxy_backend_servers: "{{ groups['control_plane'] | list }}"
    - name: Create custom firewalld service definition
      ansible.builtin.template:
        src: templates/haproxy-http.xml.j2
        dest: /etc/firewalld/services/haproxy-kubernetes-api.xml
        owner: root
        group: root
        mode: '0640'
    - name: Restore SELinux context for custom firewalld service
      ansible.builtin.command:
        cmd: restorecon /etc/firewalld/services/haproxy-kubernetes-api.xml
      become: true
    - name: Set permissions on custom firewalld service
      ansible.builtin.file:
        path: /etc/firewalld/services/haproxy-kubernetes-api.xml
        owner: root
        group: root
        mode: '0640'
      become: true
    - name: Ensure firewalld is enabled and running
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started
    - name: Reload firewalld configuration
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true
    - name: Open Kubernetes API service in firewalld
      ansible.builtin.firewalld:
        service: haproxy-kubernetes-api
        permanent: true
        immediate: true
        state: enabled
    - name: Enable and start HAProxy service
      ansible.builtin.systemd:
        name: haproxy
        enabled: true
        state: restarted