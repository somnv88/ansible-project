---
- name: prerequisite
  hosts: loadbalancer
  gather_facts: false

  tasks:
    - name: update all packages
      ansible.builtin.yum:
        name: "*"
        state: latest
    - name: Ensure firewalld open for Kubernetes API if running
      ansible.builtin.firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
      loop:
        - haproxy-kubernetes-api
      when: ansible_facts.services['firewalld.service'] is defined and ansible_facts.services['firewalld.service'].state == 'running'
