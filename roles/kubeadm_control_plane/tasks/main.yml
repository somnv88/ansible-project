---
- name: Initialize Kubernetes control plane
  ansible.builtin.command: >-
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --cri-socket={{ cri_socket }}
    --control-plane-endpoint={{ kubeadm_control_plane_endpoint | default('172.16.185.140:6443') }}
    --upload-certs
  args:
    creates: /etc/kubernetes/admin.conf
  when: inventory_hostname == groups['control_plane'][0]

- name: Create kubeconfig directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: '0700'
  when: inventory_hostname == groups['control_plane'][0]

- name: Copy admin kubeconfig for root access
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: '0600'
  when: inventory_hostname == groups['control_plane'][0]

- name: Generate worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_join_command_output
  changed_when: false
  when: inventory_hostname == groups['control_plane'][0]

- name: Generate control plane certificate key
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: kubeadm_certificate_key_output
  changed_when: false
  when: inventory_hostname == groups['control_plane'][0]

- name: Store control plane join command on the first control plane
  ansible.builtin.set_fact:
    kubeadm_control_plane_join_command: >-
      {{ kubeadm_join_command_output.stdout }}
      --control-plane
      --certificate-key {{ kubeadm_certificate_key_output.stdout_lines | last }}
      --cri-socket={{ cri_socket }}
  when: inventory_hostname == groups['control_plane'][0]

- name: Join additional control plane nodes
  ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]].kubeadm_control_plane_join_command }}"
  args:
    creates: /etc/kubernetes/kubelet.conf
  when: inventory_hostname != groups['control_plane'][0]

- name: Store join command for worker nodes
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ kubeadm_join_command_output.stdout }} --cri-socket={{ cri_socket }}"
  when: inventory_hostname == groups['control_plane'][0]