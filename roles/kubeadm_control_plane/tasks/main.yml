---
- name: Initialize Kubernetes control plane
  ansible.builtin.command: >-
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --cri-socket={{ cri_socket }}
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create kubeconfig directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: '0700'

- name: Copy admin kubeconfig for root access
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: '0600'

- name: Generate worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_join_command_output
  changed_when: false

- name: Store join command for worker nodes
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ kubeadm_join_command_output.stdout }} --cri-socket={{ cri_socket }}"