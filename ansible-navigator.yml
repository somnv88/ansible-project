ansible-navigator:
#  container-engine: podman
  execution-environment:
    enabled: true
    image: localhost/my_first_ee_image:latest
    pull:
      policy: missing
    environment-variables:
      pass:
        - AZURE_SUBSCRIPTION_ID
        - AZURE_CLIENT_ID
        - AZURE_SECRET
        - AZURE_TENANT
  mode: stdout
  playbook-artifact:
    enable: false
